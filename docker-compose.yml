# Local ClickHouse only — infra, not app code, so it's the one thing that
# actually benefits from staying in Docker during dev. web and agent-service
# change constantly while you're building; run those natively with their
# normal fast dev servers (npm run dev / uv run uvicorn --reload) pointed
# at this container, rather than putting either service in Docker for
# local iteration. See each service's README for the native setup.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123" # HTTP interface — what clickhouse-connect/mcp-clickhouse use
      - "9000:9000" # native TCP interface
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      # An empty password is rejected by the HTTP interface's auth check
      # even when CLICKHOUSE_PASSWORD is "set" to empty — confirmed by
      # testing, not a guess. Always set a real (even if trivial) local
      # dev password in your .env; CLICKHOUSE_PASSWORD has no usable
      # default here for that reason.
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set a local dev password in .env, e.g. CLICKHOUSE_PASSWORD=devpassword}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-default}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Full-stack containerized run — deploy-style testing, not active dev
  # (no bind mounts / hot reload; edits require a rebuild). Behind the
  # "full" profile so a plain `docker compose up` only starts ClickHouse.
  # Run with: docker compose --profile full up --build
  agent-service:
    profiles: ["full"]
    build:
      context: ./agent-service
    ports:
      - "8000:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      # Compose service DNS (clickhouse), not localhost — localhost inside
      # this container is itself, not the clickhouse container.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set a local dev password in .env, e.g. CLICKHOUSE_PASSWORD=devpassword}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_SECURE: "false"
      ALLOWED_ORIGINS: '["http://localhost:3000","http://web:3000"]'
      ENVIRONMENT: docker
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    profiles: ["full"]
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      # Same compose-DNS note as above: web's own Next.js server calls
      # this URL, and localhost inside web's container is itself.
      AGENT_SERVICE_URL: http://agent-service:8000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:-}}
    depends_on:
      agent-service:
        condition: service_healthy

  # Grafana Alloy — scrapes /observability/metrics and remote_writes to Grafana Cloud.
  # Runs by default (no profile) alongside ClickHouse so it works for both native dev
  # and the full docker stack.
  #
  # Native dev (agent-service runs on host):
  #   docker compose up alloy          ← uses METRICS_TARGET=host.docker.internal:8000
  #
  # Full docker stack:
  #   METRICS_TARGET=agent-service:8000 docker compose --profile full up --build
  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./grafana/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    environment:
      # Default targets the natively-running agent-service on the host machine.
      # Override to `agent-service:8000` when running via --profile full.
      METRICS_TARGET: ${METRICS_TARGET:-host.docker.internal:8000}
      METRICS_SCHEME: ${METRICS_SCHEME:-http}
      GRAFANA_PROMETHEUS_URL: ${GRAFANA_PROMETHEUS_URL}
      GRAFANA_PROMETHEUS_USERNAME: ${GRAFANA_PROMETHEUS_USERNAME}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
    ports:
      - "12345:12345"   # Alloy built-in UI + self-metrics
    # Needed on Linux so host.docker.internal resolves to the host machine.
    # On macOS Docker Desktop this is automatically available; the extra_hosts
    # entry is a no-op there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  clickhouse-data:
