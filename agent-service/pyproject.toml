[project]
name = "agentic-cinema-agent-service"
version = "0.1.0"
description = "Gemini/ADK agent sidecar for Agentic Cinema — script generation, perspective sharding, time-gated hot-seat interrogation. Stateless: Next.js owns Postgres/Supabase writes, this service owns Gemini/ADK calls and ClickHouse MCP queries."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-adk>=2.8.0",
    "google-genai>=1.0",
    "clickhouse-connect>=0.8",
    "mcp>=1.9,<2.0",
    "mcp-clickhouse==0.5.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
