[project]
name = "agentic-cinema-agent-service"
version = "0.1.0"
description = "Gemini/ADK agent sidecar for Agentic Cinema — script generation, perspective sharding, time-gated hot-seat interrogation. Stateless: Next.js owns Postgres/Supabase writes, this service owns Gemini/ADK calls and ClickHouse MCP queries."
requires-python = ">=3.12"
dependencies = [
    # Floors set to the latest available as of 2026-09-04 (verified via
    # `pip index versions`) — kept as lower bounds, not exact pins, so
    # `uv lock -U` picks up new releases going forward. uv.lock is the
    # source of truth for exact resolved versions; see README for the
    # one exception (mcp / mcp-clickhouse) and why it's pinned tighter.
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "google-adk>=2.8.0",
    "google-genai>=2.22.0",
    "clickhouse-connect>=1.8.0",
    "mcp>=1.9,<2.0",
    "mcp-clickhouse==0.5.0",
    "httpx>=0.28.1",
    # Explicit direct dep (was only transitive via google-adk) — see
    # config.py's load_dotenv() call for why this matters: pydantic-settings'
    # env_file loading does not export into os.environ, but google-genai's
    # Client reads GOOGLE_API_KEY straight from there.
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
